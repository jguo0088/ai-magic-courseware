<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 390" role="img" aria-labelledby="title desc">
  <title id="title">AI can make mistakes</title>
  <desc id="desc">A cute confused robot shows a wrong count, inviting children to check the answer.</desc>
